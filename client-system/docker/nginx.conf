# =============================================================================
# Widget Frontend — Nginx Configuration
#
# Serves the IIFE widget bundle (embed.js / embed.iife.js / embed.css) for
# cross-origin embedding. Includes CORS headers, compression, and smart caching:
# - Entry bundles (embed.iife.js / embed.js / embed.css): no-cache, must-revalidate
#   (ensures instant updates every time a new build is deployed)
# - Hashed chunks/workers (/assets/*): 1 year immutable cache
# - HTML test page: no-store, no-cache
# =============================================================================

server {
    listen 4171;
    server_name _;
    root /usr/share/nginx/html;

    # ── Gzip & Static Pre-compression ────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;
    gzip_static on;
    etag on;

    # ── Vite Hashed Static Assets (Workers & Chunks) ─────────────
    # Files under /assets/ contain content hashes; safe to cache long-term (1 year)
    location ^~ /assets/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        try_files $uri =404;
        access_log off;
        log_not_found off;

        # Single authoritative Cache-Control (no duplicate header from expires)
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ── Seamless alias for /embed.js -> /embed.iife.js ───────────
    # Transparently rewrites /embed.js to /embed.iife.js without code duplication
    location = /embed.js {
        rewrite ^ /embed.iife.js last;
    }

    # ── Unhashed Entrypoint Bundles (embed.iife.js, embed.css) ───
    # NEVER use immutable/1y on entry files without hashes!
    # "no-cache, must-revalidate" guarantees browsers validate ETag with Nginx:
    # 304 Not Modified if unchanged, 200 OK with new build immediately on deploy.
    location ~* \.(?:js|css)$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        try_files $uri =404;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ── Root & HTML Test Page (Never cache HTML) ─────────────────
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ── Health Check ─────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }

    # ── Disable Logging for Noise ────────────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}


