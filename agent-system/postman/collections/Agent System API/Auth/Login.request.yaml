$kind: http-request
description: Authenticate an agent and receive an access token.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "agent@example.com",
      "password": "password123"
    }
auth:
  type: noauth
order: 1000
