    content: "{\r

      \    \"event\": \"message:send\",\r

      \    \"payload\": {\r

      \        \"interactionId\": \"{{interactionId}}\",\r

      \        \"content\":
      \"https://www.google.com/maps?q=0.11727407514245997,117.47880845792078\",\
