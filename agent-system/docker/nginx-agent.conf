# =============================================================================
# Agent Frontend — Nginx Configuration
#
# SPA routing with COOP/COEP headers for FFmpeg.wasm SharedArrayBuffer,
# gzip compression, security headers, and smart cache invalidation:
# - index.html & SPA fallback routes: NEVER cache (no-store, no-cache)
#   (guarantees users immediately get latest chunk hashes after every build)
# - Vite hashed assets (/assets/*): 1 year immutable cache
# - Static media (images/fonts): 1 month public cache
# - Any unhashed JS/CSS fallback: no-cache, must-revalidate
# =============================================================================

server {
    listen 4172;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip & Static Pre-compression ────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;
    gzip_static on;
    etag on;

    # ── SPA Routing (HTML Entry Point — NEVER Cache) ─────────────
    # Ensures browser always fetches the latest index.html pointing to fresh asset hashes
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Security & COOP/COEP headers (Required for FFmpeg.wasm SharedArrayBuffer)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Direct request to index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # ── Vite Hashed Static Assets (Cache Forever — filenames contain hash) ──
    # Vite bundles all hashed JS/CSS chunks under /assets/
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        log_not_found off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # ── Static Media Assets (1 Month) ────────────────────────────
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        access_log off;

        add_header Cache-Control "public, max-age=2592000" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # ── Unhashed JS/CSS fallback (Outside /assets/) ──────────────
    # Any script outside /assets/ must revalidate to avoid getting stuck
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # ── Disable logging for favicon/robots ────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # ── Health Check ─────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }
}


