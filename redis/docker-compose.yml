# =============================================================================
# Redis Docker Compose — Shared Infrastructure
# =============================================================================
services:
  redis:
    image: redis:7-alpine
    container_name: webchat-redis
    restart: unless-stopped
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-localdev123}
    # No host port exposed — only accessible via Docker internal 'backend' network
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    sysctls:
      - net.core.somaxconn=511
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD:-localdev123} redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    driver: local

