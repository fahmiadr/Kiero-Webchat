# =============================================================================
# Redis Production Configuration
#
# Optimized for BullMQ + Socket.IO on a single-node deployment.
# Mounted into the Redis container via docker-compose.
# =============================================================================

# -----------------------------------------------------------------------------
# NETWORK
# -----------------------------------------------------------------------------
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Disable protected mode — auth is handled via requirepass
protected-mode no

# -----------------------------------------------------------------------------
# AUTHENTICATION
# Password is injected by Docker Compose environment variable.
# Apps connect via: redis://:YOUR_PASSWORD@localhost:6379
# -----------------------------------------------------------------------------
# requirepass is set via --requirepass flag in docker-compose command

# -----------------------------------------------------------------------------
# PERSISTENCE — RDB + AOF (belt and suspenders)
# -----------------------------------------------------------------------------

# RDB snapshots (background saves)
save 900 1
save 300 10
save 60 10000

# ⚠️ CRITICAL: Prevents READONLY errors when background save fails.
# Default is "yes" which blocks ALL writes on RDB/AOF save failure.
# Set to "no" so Redis keeps accepting writes. Monitor disk health externally.
stop-writes-on-bgsave-error no

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF (Append Only File) — more durable than RDB alone
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# -----------------------------------------------------------------------------
# MEMORY
# -----------------------------------------------------------------------------
maxmemory 512mb
maxmemory-policy noeviction

# -----------------------------------------------------------------------------
# PERFORMANCE TUNING
# -----------------------------------------------------------------------------

# Lazy freeing — delete large keys in background thread (non-blocking)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes

# Slow log — queries exceeding 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer limits (prevent runaway clients)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Max clients
maxclients 10000

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
loglevel notice
