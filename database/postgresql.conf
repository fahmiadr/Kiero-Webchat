# =============================================================================
# PostgreSQL 16 — Production Configuration
#
# Tuned for Docker container with 1GB memory limit, 1.5 CPU.
# Use case: Prisma ORM, Agent chat system, moderate concurrent connections.
# Mounted into the PostgreSQL container via docker-compose.
# =============================================================================

# -----------------------------------------------------------------------------
# CONNECTION & AUTHENTICATION
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# Superuser reserved connections (for emergency maintenance)
superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# MEMORY — Tuned for 1GB container (allocate ~70% to PostgreSQL)
# -----------------------------------------------------------------------------

# Total memory PostgreSQL can use for caching data (25% of container RAM)
shared_buffers = 256MB

# Memory per query operation (sorting, hashing, etc.)
work_mem = 4MB

# Memory for maintenance (VACUUM, CREATE INDEX, ALTER TABLE)
maintenance_work_mem = 128MB

# OS-level cache estimate (50% of container RAM — Docker usually allows this)
effective_cache_size = 512MB

# WAL buffers (auto-tuned from shared_buffers, but set explicitly)
wal_buffers = 16MB

# -----------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) — Durability + Performance Balance
# -----------------------------------------------------------------------------

# Flush WAL to disk at commit (safest for data integrity)
wal_level = replica
fsync = on
synchronous_commit = on

# Checkpoint tuning — spread I/O load over time
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# -----------------------------------------------------------------------------
# QUERY PLANNER — Optimize for SSD/NVMe storage (typical VPS)
# -----------------------------------------------------------------------------

# Cost of random page read (1.1 for SSD, 4.0 for HDD)
random_page_cost = 1.1

# Cost of sequential page read
seq_page_cost = 1.0

# Number of concurrent I/O operations the OS can handle
effective_io_concurrency = 200

# -----------------------------------------------------------------------------
# CONCURRENCY & PARALLELISM
# -----------------------------------------------------------------------------

# Workers for parallel queries (conservative for 1.5 CPU limit)
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_worker_processes = 4
max_parallel_maintenance_workers = 1

# -----------------------------------------------------------------------------
# LOGGING — Production observability
# -----------------------------------------------------------------------------
log_timezone = 'UTC'
log_destination = 'stderr'
logging_collector = off

# Log slow queries (> 500ms)
log_min_duration_statement = 500

# Log connection activity (useful for debugging Prisma pool issues)
log_connections = on
log_disconnections = on

# Log lock waits
log_lock_waits = on
deadlock_timeout = 1s

# Log temporary file usage (indicates work_mem too low)
log_temp_files = 0

# Prefix format for structured logging
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# -----------------------------------------------------------------------------
# AUTOVACUUM — Keep tables healthy automatically
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# Limit autovacuum I/O impact (prevent it from starving queries)
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# -----------------------------------------------------------------------------
# LOCALE & FORMATTING
# -----------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
